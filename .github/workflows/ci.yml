name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Swift 6 toolchain; the package builds in Swift 6 language mode.
    # macos-15 (Xcode 16) builds without FoundationModels, as for macOS 13–15;
    # macos-26 (Xcode 26) compiles the on-device model check, like releases do.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Bundle app (ad-hoc signed)
        run: ./scripts/build-app.sh
