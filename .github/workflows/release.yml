# Push a tag vX.Y.Z (matching VERSION) to build, sign, notarize and publish
# Yetda. See docs/releasing.md for the one-time setup.
#
# Secrets
#   DEVELOPER_ID_P12          base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   NOTARY_KEY_ID             App Store Connect API key ID
#   NOTARY_ISSUER_ID          App Store Connect issuer ID
#   NOTARY_KEY_P8             contents of AuthKey_<KEY_ID>.p8
#   RELEASE_TOKEN             (optional) fine-grained PAT with Contents: write on
#                             RELEASE_REPO and TAP_REPO; needed when either is
#                             not this repo
# Variables
#   RELEASE_REPO              (optional) public repo for the Release + dmg;
#                             defaults to this repo
#   TAP_REPO                  (optional) Homebrew tap, e.g. woonmayer/homebrew-tap;
#                             Casks/yetda.rb is updated there when set
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and notarize only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Xcode 26 SDK, so the on-device model check (FoundationModels) is compiled in.
    runs-on: macos-26
    env:
      RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
      TAP_REPO: ${{ vars.TAP_REPO }}
      PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION
        if: github.event_name == 'push'
        run: |
          v="$(cat VERSION)"
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} != v$v (VERSION)"; exit 1; }

      - name: Test
        run: swift build -Xswiftc -warnings-as-errors && swift test

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$id" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
          echo "YETDA_SIGN_ID=$id" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
          ./scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: yetda-dmg
          path: dist/

      - name: Release notes from CHANGELOG
        if: env.PUBLISH == 'true'
        run: |
          v="$(cat VERSION)"
          awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; }
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ### Install
          ```
          brew install --cask woonmayer/tap/yetda
          ```
          or download **Yetda.dmg** below, open it and drag Yetda to Applications.
          EOF

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          v="$(cat VERSION)"
          # The commit only exists in this repo; a release in another repo
          # (the tap) is tagged on that repo's default branch instead.
          target=()
          [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
          gh release create "v$v" --repo "$RELEASE_REPO" "${target[@]}" \
            --title "Yetda $v" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/Yetda-$v.dmg" "dist/Yetda-$v.dmg.sha256" dist/Yetda.dmg

      - name: Update Homebrew cask
        if: env.PUBLISH == 'true' && env.TAP_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          v="$(cat VERSION)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          ./scripts/render-cask.sh "$RELEASE_REPO" > "$RUNNER_TEMP/tap/Casks/yetda.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/yetda.rb
          git commit -m "yetda $v" && git push || echo "cask unchanged"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
